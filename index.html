<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Logic Gate Project</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   COLOR SYSTEM
===================================================== */

:root {

    --cream: #f5f2eb;

    --paper: #fffdf8;

    --charcoal: #1c1d20;

    --muted: #73716c;

    --line: #dedbd3;

    --blue: #315b8c;

    --blue-dark: #24466d;

    --gold: #b28a4b;

    --gold-light: #d5b77b;

}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: var(--charcoal);

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(178,138,75,0.10),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #eeeae1,
            #f7f4ed 45%,
            #eae7df
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 40px 20px;

}


/* =====================================================
   MAIN CARD
===================================================== */

.container {

    width: 100%;

    max-width: 570px;

    background: var(--paper);

    border: 1px solid
        rgba(28,29,32,0.08);

    border-radius: 26px;

    padding: 44px;

    box-shadow:

        0 25px 70px
        rgba(38,35,29,0.13),

        0 3px 10px
        rgba(38,35,29,0.05);

}


/* =====================================================
   HEADER
===================================================== */

.header {

    display: grid;

    grid-template-columns:
        64px 1fr;

    align-items: center;

    gap: 18px;

    margin-bottom: 32px;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    width: 64px;

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 17px;

    background: var(--charcoal);

    color: white;

    font-size: 19px;

    font-weight: 700;

    letter-spacing: 1px;

    box-shadow:
        0 8px 18px
        rgba(28,29,32,0.15);

}


/* =====================================================
   SMALL LABEL
===================================================== */

.kicker {

    color: var(--gold);

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 7px;

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 34px;

    line-height: 1.1;

    font-weight: 600;

    color: var(--charcoal);

    letter-spacing: -0.6px;

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle {

    color: var(--muted);

    font-size: 14px;

    line-height: 1.7;

    margin-bottom: 28px;

    max-width: 460px;

}


/* =====================================================
   IMAGE
===================================================== */

.image-box {

    width: 100%;

    height: 205px;

    margin-bottom: 32px;

    border-radius: 18px;

    overflow: hidden;

    background: #e9e6df;

    border: 1px solid
        var(--line);

}


.image-box img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    transition:
        transform 0.5s ease;

}


.image-box:hover img {

    transform: scale(1.025);

}


/* =====================================================
   NAVIGATION HEADER
===================================================== */

.navigation-heading {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 12px;

}


.navigation-heading span:first-child {

    color: var(--charcoal);

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1.3px;

    text-transform: uppercase;

}


.navigation-heading span:last-child {

    color: #aaa69e;

    font-size: 11px;

}


/* =====================================================
   BUTTON LIST
===================================================== */

.buttons {

    display: flex;

    flex-direction: column;

    gap: 9px;

}


/* =====================================================
   BUTTON LINK
===================================================== */

.buttons a {

    text-decoration: none;

    display: block;

}


/* =====================================================
   PREMIUM NAVIGATION BUTTON
===================================================== */

.buttons button {

    width: 100%;

    height: 64px;

    border: 1px solid
        var(--line);

    border-radius: 13px;

    background: #ffffff;

    color: var(--charcoal);

    display: grid;

    grid-template-columns:
        42px 1fr 30px;

    align-items: center;

    gap: 13px;

    padding: 0 16px;

    text-align: left;

    cursor: pointer;

    font-family: inherit;

    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


/* =====================================================
   NUMBER / ICON
===================================================== */

.button-number {

    width: 38px;

    height: 38px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f3f0e9;

    color: var(--blue);

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 0.5px;

    border: 1px solid
        #e5e1d8;

}


/* =====================================================
   BUTTON TEXT
===================================================== */

.button-text {

    display: flex;

    flex-direction: column;

    gap: 3px;

}


.button-title {

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 0.7px;

}


.button-description {

    color: #96928b;

    font-size: 11px;

}


/* =====================================================
   ARROW
===================================================== */

.button-arrow {

    width: 28px;

    height: 28px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #aaa69e;

    font-size: 16px;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;

}


/* =====================================================
   HOVER
===================================================== */

.buttons button:hover {

    background: #faf9f5;

    border-color:
        #c9c4b9;

    transform:
        translateY(-2px);

    box-shadow:

        0 8px 20px
        rgba(44,40,31,0.07);

}


.buttons button:hover
.button-number {

    background: var(--blue);

    color: white;

    border-color: var(--blue);

}


.buttons button:hover
.button-arrow {

    background: var(--charcoal);

    color: white;

    transform:
        translateX(2px);

}


/* =====================================================
   SPECIAL ACCENTS
===================================================== */

.buttons a:nth-child(3)
.button-number {

    color: #9b6d29;

}


.buttons a:nth-child(4)
.button-number {

    color: #76558f;

}


.buttons a:nth-child(5)
.button-number {

    color: #47786c;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 30px;

    padding-top: 18px;

    border-top: 1px solid
        var(--line);

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #aaa69e;

    font-size: 10px;

    letter-spacing: 0.8px;

    text-transform: uppercase;

}


/* =====================================================
   FOOTER GOLD DETAIL
===================================================== */

.footer::before {

    content: "";

    position: absolute;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 18px 12px;

    }


    .container {

        padding: 28px 20px;

        border-radius: 21px;

    }


    .header {

        grid-template-columns:
            54px 1fr;

        gap: 14px;

        margin-bottom: 25px;

    }


    .logo {

        width: 54px;

        height: 54px;

        border-radius: 14px;

        font-size: 16px;

    }


    h1 {

        font-size: 27px;

    }


    .subtitle {

        font-size: 13px;

    }


    .image-box {

        height: 175px;

    }


    .buttons button {

        height: 61px;

        grid-template-columns:
            38px 1fr 28px;

        padding: 0 12px;

    }


    .button-description {

        font-size: 10px;

    }


    .footer {

        flex-direction: column;

        gap: 8px;

        text-align: center;

    }

}

</style>

</head>
