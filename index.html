<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Logic Gate Project</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    color: #ffffff;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(0, 180, 255, 0.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(112, 64, 255, 0.12),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #050911 0%,
            #08111d 50%,
            #050911 100%
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 35px 15px;

    overflow-x: hidden;

}


/* =====================================================
   BACKGROUND ORBS
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background:
        rgba(0, 174, 255, 0.06);

    filter: blur(80px);

    top: -120px;
    left: -100px;

    pointer-events: none;

}

body::after {

    content: "";

    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:
        rgba(125, 70, 255, 0.06);

    filter: blur(80px);

    bottom: -100px;
    right: -80px;

    pointer-events: none;

}


/* =====================================================
   MAIN CARD
===================================================== */

.container {

    width: 100%;

    max-width: 560px;

    padding: 42px;

    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.075),
            rgba(255,255,255,0.025)
        );

    border:
        1px solid rgba(255,255,255,0.11);

    border-radius: 30px;

    backdrop-filter: blur(25px);

    -webkit-backdrop-filter: blur(25px);

    box-shadow:

        0 35px 90px
        rgba(0,0,0,0.48),

        inset 0 1px 0
        rgba(255,255,255,0.08);

    animation:
        cardAppear 0.8s ease;

}


@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   TOP LABEL
===================================================== */

.top-label {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding:
        7px 12px;

    margin-bottom: 22px;

    border-radius: 50px;

    background:
        rgba(0, 190, 255, 0.07);

    border:
        1px solid rgba(0, 190, 255, 0.16);

    color:
        #72dfff;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: 1.5px;

    text-transform: uppercase;

}


/* STATUS DOT */

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #35e8bd;

    box-shadow:
        0 0 10px #35e8bd;

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    width: 76px;
    height: 76px;

    margin-bottom: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 22px;

    background:

        linear-gradient(
            145deg,
            rgba(30,190,255,0.95),
            rgba(75,90,255,0.9)
        );

    box-shadow:

        0 12px 35px
        rgba(0,150,255,0.25),

        inset 0 1px 1px
        rgba(255,255,255,0.35);

    font-size: 25px;

    font-weight: 800;

    letter-spacing: -1px;

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    font-size: 36px;

    line-height: 1.15;

    letter-spacing: -1.2px;

    margin-bottom: 12px;

    background:

        linear-gradient(
            90deg,
            #ffffff,
            #a8dfff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color:
        transparent;

}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle {

    color: #8e9daf;

    font-size: 14px;

    line-height: 1.7;

    max-width: 430px;

    margin-bottom: 28px;

}


/* =====================================================
   IMAGE
===================================================== */

.image-box {

    width: 100%;

    padding: 7px;

    margin-bottom: 30px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.045);

    border:
        1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,0.25);

    overflow: hidden;

}


.image-box img {

    width: 100%;

    height: 210px;

    object-fit: cover;

    display: block;

    border-radius: 15px;

    opacity: 0.92;

    transition:
        transform 0.6s ease,
        opacity 0.4s ease;

}


.image-box:hover img {

    transform: scale(1.035);

    opacity: 1;

}


/* =====================================================
   SECTION LABEL
===================================================== */

.section-label {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 13px;

    color: #66768b;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

}

.section-label::after {

    content: "";

    height: 1px;

    flex: 1;

    background:
        rgba(255,255,255,0.07);

}


/* =====================================================
   NAVIGATION
===================================================== */

.buttons {

    display: flex;

    flex-direction: column;

    gap: 10px;

}


/* =====================================================
   LINK
===================================================== */

.buttons a {

    text-decoration: none;

    display: block;

}


/* =====================================================
   PREMIUM BUTTON
===================================================== */

.buttons button {

    width: 100%;

    height: 62px;

    padding: 0 17px;

    display: flex;

    align-items: center;

    gap: 14px;

    position: relative;

    overflow: hidden;

    border-radius: 16px;

    border:
        1px solid rgba(255,255,255,0.075);

    color: #dce7f3;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.018)
        );

    cursor: pointer;

    font-family: inherit;

    font-size: 13px;

    font-weight: 600;

    letter-spacing: 0.8px;

    text-align: left;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.045);

    transition:

        transform 0.3s ease,

        background 0.3s ease,

        border 0.3s ease,

        box-shadow 0.3s ease;

}


/* =====================================================
   ICON
===================================================== */

.icon {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 11px;

    color: #8edfff;

    background:
        rgba(0,190,255,0.065);

    border:
        1px solid rgba(0,190,255,0.10);

    font-size: 14px;

    font-weight: 700;

    transition:
        transform 0.3s ease,
        background 0.3s ease;

}


/* =====================================================
   BUTTON ARROW
===================================================== */

.arrow {

    margin-left: auto;

    color: #526276;

    font-size: 18px;

    transition:
        transform 0.3s ease,
        color 0.3s ease;

}


/* =====================================================
   BUTTON HOVER
===================================================== */

.buttons button:hover {

    transform:
        translateX(4px);

    background:

        linear-gradient(
            135deg,
            rgba(0,180,255,0.085),
            rgba(255,255,255,0.035)
        );

    border-color:
        rgba(90,205,255,0.20);

    box-shadow:

        0 10px 28px
        rgba(0,0,0,0.22),

        inset 0 1px 0
        rgba(255,255,255,0.08);

}


.buttons button:hover .icon {

    transform:
        scale(1.08);

    background:
        rgba(0,190,255,0.12);

}


.buttons button:hover .arrow {

    transform:
        translateX(5px);

    color: #72dfff;

}


/* =====================================================
   ACTIVE
===================================================== */

.buttons button:active {

    transform:
        translateX(2px)
        scale(0.99);

}


/* =====================================================
   INDIVIDUAL ACCENTS
===================================================== */

.buttons a:nth-child(1) .icon {
    color: #79aaff;
}

.buttons a:nth-child(2) .icon {
    color: #52e7bd;
}

.buttons a:nth-child(3) .icon {
    color: #ffba70;
}

.buttons a:nth-child(4) .icon {
    color: #c29aff;
}

.buttons a:nth-child(5) .icon {
    color: #65dfff;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: 30px;

    padding-top: 20px;

    border-top:
        1px solid rgba(255,255,255,0.06);

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #566579;

    font-size: 10px;

    letter-spacing: 0.7px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 20px 12px;

    }


    .container {

        padding: 28px 20px;

        border-radius: 25px;

    }


    h1 {

        font-size: 29px;

    }


    .logo {

        width: 68px;
        height: 68px;

    }


    .image-box img {

        height: 175px;

    }


    .buttons button {

        height: 58px;

    }


    .footer {

        flex-direction: column;

        gap: 7px;

        text-align: center;

    }

}

</style>

</head>


<body>


<div class="container">

</body>
