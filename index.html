<!DOCTYPE html>
<html>
<head>

<title>Logic Gate Project</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top left, #163c67, transparent 40%),
        radial-gradient(circle at bottom right, #163b54, transparent 40%),
        linear-gradient(135deg, #050d18, #0c1d31, #050d18);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}


/* =========================================
   MAIN CARD
========================================= */

.container {
    width: 92%;
    max-width: 520px;

    background: rgba(255,255,255,0.07);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 24px;

    padding: 38px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.55);

    backdrop-filter: blur(15px);

    animation: containerIn 0.8s ease;
}

@keyframes containerIn {

    from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================
   LOGO
========================================= */

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 18px;

    border-radius: 20px;

    background:
        linear-gradient(135deg, #2878ff, #00c896);

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    font-size: 25px;
    font-weight: bold;

    box-shadow:
        0 10px 30px rgba(0,150,255,0.3);

    animation: logoGlow 3s infinite alternate;
}

@keyframes logoGlow {

    from {
        box-shadow:
            0 10px 30px rgba(0,150,255,0.3);
    }

    to {
        box-shadow:
            0 10px 40px rgba(0,220,200,0.55);
    }

}


/* =========================================
   TITLE
========================================= */

h1 {
    color: white;

    margin: 0 0 10px;

    font-size: 32px;

    letter-spacing: 1px;
}

.subtitle {
    color: #a9b8cc;

    margin-bottom: 28px;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================================
   IMAGE
========================================= */

.image-box {
    background: rgba(255,255,255,0.95);

    padding: 10px;

    border-radius: 17px;

    display: inline-block;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.4);

    margin-bottom: 30px;

    transition: 0.3s;
}

.image-box:hover {
    transform: scale(1.04);

    box-shadow:
        0 15px 40px rgba(40,140,255,0.35);
}

.image-box img {
    width: 240px;
    height: 180px;

    object-fit: cover;

    display: block;

    border-radius: 11px;
}


/* =========================================
   BUTTON AREA
========================================= */

.buttons {
    display: flex;

    flex-direction: column;

    gap: 14px;
}

.buttons a {
    text-decoration: none;

    display: block;
}


/* =========================================
   ALL BUTTONS
========================================= */

.buttons button {

    width: 100%;

    min-height: 58px;

    padding: 16px 18px;

    border: 1px solid rgba(255,255,255,0.14);

    border-radius: 14px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    letter-spacing: 0.8px;

    cursor: pointer;

    position: relative;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        filter 0.3s ease;
}


/* =========================================
   BUTTON ICON
========================================= */

.buttons button span {

    font-size: 21px;

    filter:
        drop-shadow(
            0 0 6px rgba(255,255,255,0.55)
        );

    transition:
        transform 0.3s ease;
}

.buttons button:hover span {

    transform:
        scale(1.25)
        rotate(5deg);
}


/* =========================================
   BUTTON SHINE
========================================= */

.buttons button::before {

    content: "";

    position: absolute;

    top: 0;

    left: -120%;

    width: 75%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.3),
            transparent
        );

    transform: skewX(-20deg);

    transition:
        left 0.6s ease;
}

.buttons button:hover::before {
    left: 140%;
}


/* =========================================
   BUTTON HOVER
========================================= */

.buttons button:hover {

    transform:
        translateY(-5px)
        scale(1.015);

    filter:
        brightness(1.12);
}

.buttons button:active {

    transform:
        scale(0.97);
}


/* =========================================
   BUTTON 1 - ABOUT US
========================================= */

.buttons a:nth-child(1) button {

    background:
        linear-gradient(
            135deg,
            #2878ff,
            #5148e5
        );

    box-shadow:
        0 8px 24px
        rgba(40,120,255,0.30);
}

.buttons a:nth-child(1) button:hover {

    box-shadow:
        0 15px 38px
        rgba(40,120,255,0.55);
}


/* =========================================
   BUTTON 2 - LOGIC GATES
========================================= */

.buttons a:nth-child(2) button {

    background:
        linear-gradient(
            135deg,
            #00a878,
            #00e0a0
        );

    box-shadow:
        0 8px 24px
        rgba(0,210,155,0.30);
}

.buttons a:nth-child(2) button:hover {

    box-shadow:
        0 15px 38px
        rgba(0,230,170,0.55);
}


/* =========================================
   BUTTON 3 - BINARY ARITHMETIC
========================================= */

.buttons a:nth-child(3) button {

    background:
        linear-gradient(
            135deg,
            #ff8a00,
            #ff4d4d
        );

    box-shadow:
        0 8px 24px
        rgba(255,120,0,0.32);

    border:
        1px solid rgba(255,190,80,0.35);
}

.buttons a:nth-child(3) button:hover {

    background:
        linear-gradient(
            135deg,
            #ff9f1a,
            #ff5c5c
        );

    box-shadow:
        0 15px 38px
        rgba(255,100,0,0.55);
}


/* =========================================
   BUTTON 4 - COMPLEMENTS
========================================= */

.buttons a:nth-child(4) button {

    background:
        linear-gradient(
            135deg,
            #8e44ff,
            #d62cff
        );

    box-shadow:
        0 8px 25px
        rgba(160,60,255,0.32);

    border:
        1px solid rgba(210,120,255,0.35);
}

.buttons a:nth-child(4) button:hover {

    background:
        linear-gradient(
            135deg,
            #a45cff,
            #ed3cff
        );

    box-shadow:
        0 15px 40px
        rgba(190,60,255,0.58);
}


/* =========================================
   BUTTON 5 - ADDERS
========================================= */

.buttons a:nth-child(5) button {

    background:
        linear-gradient(
            135deg,
            #008cff,
            #00d9ff
        );

    box-shadow:
        0 8px 25px
        rgba(0,180,255,0.32);

    border:
        1px solid rgba(80,220,255,0.35);
}

.buttons a:nth-child(5) button:hover {

    background:
        linear-gradient(
            135deg,
            #00a8ff,
            #22e4ff
        );

    box-shadow:
        0 15px 40px
        rgba(0,205,255,0.58);
}


/* =========================================
   FOOTER
========================================= */

.footer {

    margin-top: 27px;

    padding-top: 18px;

    border-top:
        1px solid rgba(255,255,255,0.08);

    color: #71839b;

    font-size: 12px;

    letter-spacing: 0.5px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 500px) {

    body {
        padding: 20px 0;
    }

    .container {

        width: 94%;

        padding: 28px 20px;

    }

    h1 {

        font-size: 26px;

    }

    .logo {

        width: 60px;
        height: 60px;

        font-size: 21px;

    }

    .image-box img {

        width: 100%;

        max-width: 240px;

        height: auto;

    }

    .buttons button {

        min-height: 55px;

        font-size: 14px;

    }

}

</style>

</head>
